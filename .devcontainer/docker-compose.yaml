services:
  # zmsbase uses per-arch tags. devcontainer initializeCommand runs
  # .devcontainer/scripts/sync-php-base-tag.sh (see devcontainer.json) sets ZMS_PHP_BASE_TAG from host uname.
  # Fallback default is amd64 for plain `docker compose` without that step.
  web:
    container_name: zms-web
    image: ghcr.io/it-at-m/eappointment/zmsbase:${ZMS_PHP_BASE_TAG:-8.3-local-amd64}
    volumes:
      - ..:/var/www/html:cached,z
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro,z
    ports:
      - "8090:80"
    env_file:
      - .env
    depends_on:
      - db
      - keycloak
    networks:
      - default

  mail-viewer:
    image: node:24
    container_name: zms-mail-viewer
    working_dir: /workspace/.devcontainer/mail-viewer
    volumes:
      - ..:/workspace:cached,z
    command: sh -c "npm install && npm start"
    ports:
      - "8025:8025"
    environment:
      - PORT=8025
      - ZMS_API_URL=http://web/terminvereinbarung/api/2
      - ZMS_MAIL_VIEWER_API_USER=${ZMS_MAIL_VIEWER_API_USER:-superuser}
      - ZMS_MAIL_VIEWER_API_PASSWORD=${ZMS_MAIL_VIEWER_API_PASSWORD:-vorschau}
      - ZMS_MAIL_VIEWER_USER=${ZMS_MAIL_VIEWER_USER:-superuser}
      - ZMS_MAIL_VIEWER_PASSWORD=${ZMS_MAIL_VIEWER_PASSWORD:-vorschau}
    env_file:
      - .env
    depends_on:
      - web
    networks:
      - default
    restart: unless-stopped

  citizenview:
    image: node:24
    container_name: zms-citizenview
    working_dir: /workspace/zmscitizenview
    volumes:
      - ..:/workspace:cached,z
      # Keep Linux native bindings (Vite/Rolldown) off the macOS host node_modules bind.
      - citizenview-node-modules:/workspace/zmscitizenview/node_modules
    env_file:
      - .env
    environment:
      # Prefer .devcontainer/.env; zmscitizenview/.env.development is the Vite fallback.
      SHOW_CITIZEN_LOGIN: ${SHOW_CITIZEN_LOGIN:-true}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8082"
    ports:
      - "8082:8082"
    depends_on:
      - web
    networks:
      - default
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: zms-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
      - ../.resources/zms.sql:/docker-entrypoint-initdb.d/01-zms.sql:ro,z
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: zms-phpmyadmin
    restart: unless-stopped
    ports:
      - "8036:80"
    environment:
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_HOST=zms-db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=25600M
    depends_on:
      - db

  refarch-gateway:
    image: ghcr.io/it-at-m/refarch/refarch-gateway:1.9.0
    container_name: zms-refarch-gateway
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=no-security
      - WEBCOMPONENT_URI=http://localhost:8080
    volumes:
      - ./local-gateway-application.yml:/deployments/application.yml:ro,z
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:831330513f55695572286e521f94fcd3c7e285250ed5b848090265a33192f669
    container_name: zms-keycloak
    hostname: keycloak
    command:
      - start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_DB=dev-file
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/plugins:/opt/keycloak/providers/:z
    networks:
      default:
        aliases:
          - keycloak
    restart: unless-stopped

  init-keycloak-token:
    image: curlimages/curl:8.21.0
    container_name: zms-init-keycloak-token
    depends_on:
      keycloak:
        condition: service_started
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - KEYCLOAK_ADMIN_TOKEN_LIFESPAN=1800
    volumes:
      - ../.resources/keycloak/extend-admin-token-lifespan.sh:/extend-admin-token-lifespan.sh:ro,z
    entrypoint: ["/bin/sh", "/extend-admin-token-lifespan.sh"]
    networks:
      - default
    restart: "no"

  # 0.2.131 JAR is Java 24; upstream image still ships a 23 JRE.
  init-keycloak-jar:
    image: klg71/keycloakmigration:0.2.131@sha256:a311cce3b961062000e6e9ef08ecb5712f3ea81859beeee8cd0c836fe8e4f2cf
    # Image is amd64-only. Apple Silicon (arm64) still works: Podman emulates this
    # one-shot `cp`. Java itself runs natively on Temurin below.
    platform: linux/amd64
    container_name: zms-init-keycloak-jar
    volumes:
      - keycloakmigration-jar:/out
    entrypoint: ["/bin/sh", "-c", "cp /keycloakmigration.jar /entrypoint.sh /out/"]
    networks:
      - default
    restart: "no"

  init-keycloak:
    image: eclipse-temurin:25-jre-alpine@sha256:3137541deb3cac6626b5d9a4a2187bc0d6a34312f858bd2c67dd01e732e6b682
    container_name: zms-init-keycloak
    working_dir: /opt/keycloakmigration
    depends_on:
      init-keycloak-token:
        condition: service_completed_successfully
      init-keycloak-jar:
        condition: service_completed_successfully
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - WAIT_FOR_KEYCLOAK=true
      - FAIL_ON_UNDEFINED_VARIABLES=true
      - KEYCLOAK_CHANGELOG=/migration/keycloak-changelog.yml
      - EXIT_ON_ERROR=true
    volumes:
      - keycloakmigration-jar:/opt/keycloakmigration:ro,z
      - ../.resources/keycloak/migration:/migration:z
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    networks:
      - default
    restart: "no"

volumes:
  db-data:
  citizenview-node-modules:
  keycloakmigration-jar:
