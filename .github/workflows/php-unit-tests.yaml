name: 🧪 unit tests

on:
  workflow_call:
    inputs:
      selected:
        description: JSON array of module names that should actually run phpunit
        type: string
        required: false
        default: '["mellon","zmsadmin","zmsbackend","zmscalldisplay","zmscitizenapi","zmsclient","zmsdldb","zmsentities","zmsmessaging","zmsslim","zmsstatistic","zmsticketprinter"]'
    outputs:
      module-test-result:
        description: "Module test result"
        value: ${{ jobs.module-test.outputs.result }}
      zmsbackend-test-result:
        description: "ZMSBACKEND test result"
        value: ${{ jobs.zmsbackend-test.outputs.result }}
      zmsclient-test-result:
        description: "ZMSClient test result"
        value: ${{ jobs.zmsclient-test.outputs.result }}

permissions:
  contents: read
  actions: write

jobs:
  module-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mellon
            php_version: "8.3"
          - module: zmsadmin
            php_version: "8.3"
          - module: zmscalldisplay
            php_version: "8.3"
          - module: zmscitizenapi
            php_version: "8.3"
          - module: zmsdldb
            php_version: "8.3"
          - module: zmsentities
            php_version: "8.3"
          - module: zmsmessaging
            php_version: "8.3"
          - module: zmsslim
            php_version: "8.3"
          - module: zmsstatistic
            php_version: "8.3"
          - module: zmsticketprinter
            php_version: "8.3"
    container:
      image: "ghcr.io/it-at-m/eappointment/zmsbase:${{ matrix.php_version }}-dev@sha256:cdf964fa2e02d11b1309f1006d0d71d0afef6a550d5722c7634860e5c594d4cb"
    env:
      XDEBUG_MODE: coverage
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/conf.d:/tmp/php/conf.d"
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      - name: Unchanged vs next
        if: ${{ !contains(fromJSON(inputs.selected), matrix.module) }}
        run: echo "Skipping phpunit for ${{ matrix.module }} (unchanged). Job succeeds so required checks complete."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        with:
          persist-credentials: false
      - name: Configure Git Safe Directory
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure PHP
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        run: |
          mkdir -p /tmp/php/conf.d
          echo "zend_extension=xdebug.so" > /tmp/php/conf.d/xdebug.ini
          echo "xdebug.mode=coverage" >> /tmp/php/conf.d/xdebug.ini
          echo "xdebug.start_with_request=yes" >> /tmp/php/conf.d/xdebug.ini

      - name: Install Composer Dependencies
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        uses: ./.github/actions/composer-install
        with:
          working-directory: ${{ matrix.module }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests with Coverage
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        env:
          XDEBUG_MODE: coverage
        run: |
          set -e  # Exit immediately on any error
          cd "${{ matrix.module }}"
          mkdir -p coverage
          echo "Running tests for ${{ matrix.module }}"
          
          # Handle zmsslim's missing phpunit.xml
          if [ "${{ matrix.module }}" = "zmsslim" ] && [ ! -f "phpunit.xml" ] && [ -f "phpunit.xml.dist" ]; then
            cp phpunit.xml.dist phpunit.xml
          fi

          # Handle mellon missing phpunit.xml
          if [ "${{ matrix.module }}" = "mellon" ] && [ ! -f "phpunit.xml" ] && [ -f "phpunit.xml.dist" ]; then
            cp phpunit.xml.dist phpunit.xml
          fi
          
          # Run all modules with coverage
          echo "Running tests WITH coverage for ${{ matrix.module }}"
          php -dmemory_limit=-1 ./vendor/bin/phpunit -c phpunit.xml \
            --coverage-html coverage/html \
            --coverage-clover coverage/clover.xml \
            --log-junit coverage/junit.xml \
            --display-deprecations --display-warnings --fail-on-deprecation

      - name: Upload Coverage
        if: ${{ contains(fromJSON(inputs.selected), matrix.module) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage/
          retention-days: 1

      - name: Set job result
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  zmsbackend-test:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/it-at-m/eappointment/zmsbase:8.3-dev@sha256:5743860e7e9bf5755d75e9f2cd6b0f8986a779a0ef02e8cffee2bfd21fdd85fc"
    services:
      mariadb:
        image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
        env:
          MYSQL_ROOT_PASSWORD: zmsbackend
          MYSQL_DATABASE: zmsbo
          MYSQL_CHARACTER_SET: utf8mb4
          MYSQL_COLLATION: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
          --memory=1g
          --cpus=1
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      - name: Unchanged vs next
        if: ${{ !contains(fromJSON(inputs.selected), 'zmsbackend') }}
        run: echo "Skipping zmsbackend phpunit (unchanged). Job succeeds so required checks complete."

      - name: Checkout GitHub Action
        if: ${{ contains(fromJSON(inputs.selected), 'zmsbackend') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Git Safe Directory
        if: ${{ contains(fromJSON(inputs.selected), 'zmsbackend') }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Composer Dependencies
        if: ${{ contains(fromJSON(inputs.selected), 'zmsbackend') }}
        uses: ./.github/actions/composer-install
        with:
          working-directory: zmsbackend
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Test Data and Run Unit Tests
        if: ${{ contains(fromJSON(inputs.selected), 'zmsbackend') }}
        env:
          MYSQL_PORT: "tcp://mariadb:3306"
          MYSQL_DATABASE: zmsbo
          MYSQL_ROOT_PASSWORD: zmsbackend
          MYSQL_USER: root
          MYSQL_PASSWORD: zmsbackend
          CACHE_DIR: /tmp/cache
          ZMS_CONFIG_SECURE_TOKEN: secure-token
          SKIP_DNS_VALIDATION: 1
        run: |
          set -e
          mkdir -p /tmp/cache
          mkdir -p zmsbackend/data
          cp zmsbackend/tests/Zmsbackend/Service/fixtures/*.json zmsbackend/data/
          zmsbackend/bin/configure
          export ZMS_DLDB_PATH="$GITHUB_WORKSPACE/zmsbackend/data"
          cd zmsbackend
          bin/importTestData --commit
          mkdir -p coverage
          php -dzend_extension=xdebug.so -dxdebug.mode=coverage -dmemory_limit=2G -dopcache.enable=1 -dopcache.memory_consumption=128 \
            ./vendor/bin/phpunit -c phpunit.xml \
            --coverage-html coverage/html \
            --coverage-clover coverage/clover.xml \
            --log-junit coverage/junit.xml \
            --display-deprecations --display-warnings
      - name: Upload Coverage
        if: ${{ contains(fromJSON(inputs.selected), 'zmsbackend') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-zmsbackend
          path: zmsbackend/coverage/
          retention-days: 1
      - name: Set job result
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  zmsclient-test:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      - name: Unchanged vs next
        if: ${{ !contains(fromJSON(inputs.selected), 'zmsclient') }}
        run: echo "Skipping zmsclient phpunit (unchanged). Job succeeds so required checks complete."

      - name: Checkout GitHub Action
        if: ${{ contains(fromJSON(inputs.selected), 'zmsclient') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        if: ${{ contains(fromJSON(inputs.selected), 'zmsclient') }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: xdebug

      - name: Install Composer Dependencies
        if: ${{ contains(fromJSON(inputs.selected), 'zmsclient') }}
        uses: ./.github/actions/composer-install
        with:
          working-directory: zmsclient
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        if: ${{ contains(fromJSON(inputs.selected), 'zmsclient') }}
        env:
          XDEBUG_MODE: coverage
        run: |
          set -e  # Exit immediately on any error
          cd ./zmsclient
          mkdir -p coverage
          docker compose up -d
          
          echo "Running tests WITH coverage for zmsclient"
          docker compose exec -T test php -dmemory_limit=-1 \
            ./vendor/bin/phpunit \
            --coverage-html coverage/html \
            --coverage-clover coverage/clover.xml \
            --log-junit coverage/junit.xml \
            --display-deprecations --display-warnings --fail-on-deprecation
      - name: Upload Coverage
        if: ${{ contains(fromJSON(inputs.selected), 'zmsclient') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-zmsclient
          path: zmsclient/coverage/
          retention-days: 1

      - name: Set job result
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"
