name: 🧪 unit tests

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON object with include[] of {module, php_version}
        type: string
        required: false
        default: '{"include":[{"module":"mellon","php_version":"8.3"},{"module":"zmsadmin","php_version":"8.3"},{"module":"zmscalldisplay","php_version":"8.3"},{"module":"zmscitizenapi","php_version":"8.3"},{"module":"zmsdldb","php_version":"8.3"},{"module":"zmsentities","php_version":"8.3"},{"module":"zmsmessaging","php_version":"8.3"},{"module":"zmsslim","php_version":"8.3"},{"module":"zmsstatistic","php_version":"8.3"},{"module":"zmsticketprinter","php_version":"8.3"}]}'
    outputs:
      module-test-result:
        description: "Module test result"
        value: ${{ jobs.module-test.outputs.result }}

permissions:
  contents: read
  actions: write

jobs:
  module-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    container:
      image: "ghcr.io/it-at-m/eappointment/zmsbase:${{ matrix.php_version }}-dev@sha256:cdf964fa2e02d11b1309f1006d0d71d0afef6a550d5722c7634860e5c594d4cb"
    env:
      XDEBUG_MODE: coverage
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/conf.d:/tmp/php/conf.d"
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure PHP
        run: |
          mkdir -p /tmp/php/conf.d
          echo "zend_extension=xdebug.so" > /tmp/php/conf.d/xdebug.ini
          echo "xdebug.mode=coverage" >> /tmp/php/conf.d/xdebug.ini
          echo "xdebug.start_with_request=yes" >> /tmp/php/conf.d/xdebug.ini

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          working-directory: ${{ matrix.module }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests with Coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          set -e  # Exit immediately on any error
          cd "${{ matrix.module }}"
          mkdir -p coverage
          echo "Running tests for ${{ matrix.module }}"
          
          # Handle zmsslim's missing phpunit.xml
          if [ "${{ matrix.module }}" = "zmsslim" ] && [ ! -f "phpunit.xml" ] && [ -f "phpunit.xml.dist" ]; then
            cp phpunit.xml.dist phpunit.xml
          fi

          # Handle mellon missing phpunit.xml
          if [ "${{ matrix.module }}" = "mellon" ] && [ ! -f "phpunit.xml" ] && [ -f "phpunit.xml.dist" ]; then
            cp phpunit.xml.dist phpunit.xml
          fi
          
          # Run all modules with coverage
          echo "Running tests WITH coverage for ${{ matrix.module }}"
          php -dmemory_limit=-1 ./vendor/bin/phpunit -c phpunit.xml \
            --coverage-html coverage/html \
            --coverage-clover coverage/clover.xml \
            --log-junit coverage/junit.xml \
            --display-deprecations --display-warnings --fail-on-deprecation

      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage/
          retention-days: 1

      - name: Set job result
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"
