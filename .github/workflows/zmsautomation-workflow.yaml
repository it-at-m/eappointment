name: ⚙️ zmsautomation
run-name: >-
  ${{
    github.event_name == 'schedule' && 'zmsautomation | ⏰ scheduled | UI × chrome+firefox+edge, API once | next'
    || (github.event_name == 'workflow_dispatch' && inputs.run_main_next_matrix
        && format(
             'zmsautomation | ▶️ manual | full shard matrix | UI × chrome+firefox+edge, API once | next{0}{1}',
             inputs.ataf_version != '' && format(' | ATAF {0}', inputs.ataf_version) || '',
             inputs.serial_scenarios && ' | serial scenarios' || ''
           ))
    || format(
         'zmsautomation | ▶️ manual | {0} | {1}{2}{3}{4}',
         github.ref_name,
         format('{0}{1}{2}', inputs.browser_chrome && '🌐 chrome' || '', inputs.browser_firefox && format('{0}🦊 firefox', inputs.browser_chrome && ' + ' || '') || '', inputs.browser_edge && format('{0}🪟 edge', (inputs.browser_chrome || inputs.browser_firefox) && ' + ' || '') || ''),
         inputs.cucumber_tag_expressions != '' && format(' | {0}', inputs.cucumber_tag_expressions) || (inputs.use_custom_tags && ' | custom tags' || '') || (inputs.viewport_mobile_only && ' | 📱 @mobile' || ''),
         inputs.ataf_version != '' && format(' | ATAF {0}', inputs.ataf_version) || '',
         inputs.serial_scenarios && ' | serial scenarios' || ''
       )
  }}

on:
  workflow_dispatch:
    inputs:
      run_main_next_matrix:
        description: |
          Run the full scheduled shard matrix: next; UI modules (zmsadmin,
          zmscitizenview, zmsstatistic, zmsticketprinter, zmscalldisplay) on chrome + firefox + edge; API modules (zmsapi,
          zmscitizenapi) once each. Ignores module/browser inputs below.
        required: true
        type: boolean
        default: false
      run_all_in_one_job:
        description: |
          Run the full suite in one sequential job per checked browser instead of
          parallel module shards. Default (disabled): all checked modules below run
          in parallel on the branch selected via "Use workflow from" above.
        required: true
        type: boolean
        default: false
      serial_scenarios:
        description: |
          Don't run scenarios in parallel.
          Each job uses one Cucumber thread instead of the profile default
          (32 API threads, 16 UI browsers).
        required: true
        type: boolean
        default: false
      module_admin:
        description: "Admin UI tests (@zmsadmin)"
        required: true
        type: boolean
        default: true
      module_citizenview:
        description: "Citizenview UI tests (@zmscitizenview)"
        required: true
        type: boolean
        default: true
      viewport_mobile_only:
        description: |
          Run only @mobile UI scenarios (phone 390×844). Used by zmscitizenview.
          Ignores module checkboxes and run_all_in_one_job (same idea as custom tags).
          Ignored when cucumber_tag_expressions is set or use_custom_tags is enabled.
        required: true
        type: boolean
        default: false
      module_statistic:
        description: "Statistic UI tests (@zmsstatistic)"
        required: true
        type: boolean
        default: true
      module_ticketprinter:
        description: "Ticketprinter UI tests (@zmsticketprinter)"
        required: true
        type: boolean
        default: true
      module_calldisplay:
        description: "Call display UI tests (@zmscalldisplay)"
        required: true
        type: boolean
        default: true
      module_zmsapi:
        description: "zmsapi REST tests (@zmsapi)"
        required: true
        type: boolean
        default: true
      module_zmscitizenapi:
        description: "zmscitizenapi REST tests (@zmscitizenapi)"
        required: true
        type: boolean
        default: true
      use_custom_tags:
        description: |
          Run a single job (ignores module checkboxes and run_all_in_one_job).
          Implied automatically when cucumber_tag_expressions is non-empty.
        required: true
        type: boolean
        default: false
      test_layer:
        description: |
          Used when cucumber_tag_expressions is set or use_custom_tags is enabled.
          API = REST, UI = Selenium, both = full suite in one job.
        required: true
        type: choice
        options:
          - both
          - api
          - ui
        default: both
      cucumber_tag_expressions:
        description: |
          Optional. Newline-separated Cucumber tag expressions; each line runs sequentially.
          If this field is set, only those tags run (module checkboxes are ignored).
          @ignore is excluded automatically.
          Examples: @ZMSKVR-833, @smoke
        required: false
        default: ""
      browser_chrome:
        description: "Chrome for UI tests"
        required: true
        type: boolean
        default: true
      browser_firefox:
        description: "Firefox for UI tests"
        required: true
        type: boolean
        default: false
      browser_edge:
        description: "Edge for UI tests"
        required: true
        type: boolean
        default: false
      per_step_screenshots:
        description: Enable/disable per-step screenshots
        required: true
        type: boolean
        default: true
      ataf_version:
        description: |
          Optional ATAF Maven version override (de.muenchen.ataf:core|rest|web).
          Leave empty to use ataf.version from zmsautomation/pom.xml on the
          checked-out branch. Example: 0.3.3
        required: false
        type: string
        default: ""
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC ≈ 03:00 Europe/Berlin (CEST) / 02:00 (CET).
    # That is after the former UTC vs Berlin CURDATE split; zms-db TZ is Europe/Berlin (GH-3257).
    - cron: "0 1 * * *"

permissions:
  contents: read
  packages: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
    steps:
      - name: Build job matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          append_not_ignore() {
            local expr="$1"
            if [[ -z "$expr" ]]; then
              printf '%s' "not @ignore"
            else
              printf '%s' "(${expr}) and not @ignore"
            fi
          }

          FULL_MATRIX=false
          MATRIX_BRANCHES='["next"]'
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.run_main_next_matrix }}" == "true" ]]; then
            FULL_MATRIX=true
          fi

          if [[ "$FULL_MATRIX" == true ]]; then
            jq -n \
              --arg admin "$(append_not_ignore '@zmsadmin')" \
              --arg citizenview "$(append_not_ignore '@zmscitizenview')" \
              --arg statistic "$(append_not_ignore '@zmsstatistic')" \
              --arg ticketprinter "$(append_not_ignore '@zmsticketprinter')" \
              --arg calldisplay "$(append_not_ignore '@zmscalldisplay')" \
              --arg zmsapi "$(append_not_ignore '@zmsapi')" \
              --arg zmscitizenapi "$(append_not_ignore '@zmscitizenapi')" \
              --argjson branches "$MATRIX_BRANCHES" \
              '
              {
                include: (
                  [
                    $branches[] as $branch
                    | [
                        {shard: "zmsadmin", test_layer: "ui", tag_filter: $admin},
                        {shard: "zmscitizenview", test_layer: "ui", tag_filter: $citizenview},
                        {shard: "zmsstatistic", test_layer: "ui", tag_filter: $statistic},
                        {shard: "zmsticketprinter", test_layer: "ui", tag_filter: $ticketprinter},
                        {shard: "zmscalldisplay", test_layer: "ui", tag_filter: $calldisplay}
                      ][] as $shard
                    | ["chrome", "firefox", "edge"][] as $browser
                    | $shard + {branch: $branch, browser: $browser, use_custom_tags: false}
                  ]
                  + [
                    $branches[] as $branch
                    | [
                        {shard: "zmsapi", test_layer: "api", tag_filter: $zmsapi},
                        {shard: "zmscitizenapi", test_layer: "api", tag_filter: $zmscitizenapi}
                      ][] as $shard
                    | $shard + {branch: $branch, browser: "chrome", use_custom_tags: false}
                  ]
                )
              }
              ' > matrix.json
            MATRIX_SIZE="$(jq '.include | length' matrix.json)"
            echo "max_parallel=$MATRIX_SIZE" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.ref_name }}"
            TEST_LAYER="${{ inputs.test_layer }}"
            TAG_INPUT="${{ inputs.cucumber_tag_expressions }}"
            TAG_INPUT_TRIMMED="$(printf '%s' "$TAG_INPUT" | tr -d '[:space:]')"

            BROWSERS_JSON='[]'
            if [[ "${{ inputs.browser_chrome }}" == "true" ]]; then
              BROWSERS_JSON="$(jq -c '. + ["chrome"]' <<<"$BROWSERS_JSON")"
            fi
            if [[ "${{ inputs.browser_firefox }}" == "true" ]]; then
              BROWSERS_JSON="$(jq -c '. + ["firefox"]' <<<"$BROWSERS_JSON")"
            fi
            if [[ "${{ inputs.browser_edge }}" == "true" ]]; then
              BROWSERS_JSON="$(jq -c '. + ["edge"]' <<<"$BROWSERS_JSON")"
            fi
            if [[ "$(jq 'length' <<<"$BROWSERS_JSON")" -eq 0 ]]; then
              echo "Select at least one browser."
              exit 1
            fi

            # Filling the tag field is enough; the checkbox is optional.
            if [[ "${{ inputs.use_custom_tags }}" == "true" || -n "$TAG_INPUT_TRIMMED" ]]; then
              jq -n \
                --arg branch "$BRANCH" \
                --argjson browsers "$BROWSERS_JSON" \
                --arg test_layer "$TEST_LAYER" \
                --arg tag_filter "$TAG_INPUT" \
                '
                {
                  include: (
                    if $test_layer == "api" then
                      [{
                        branch: $branch,
                        browser: $browsers[0],
                        shard: "custom",
                        test_layer: $test_layer,
                        tag_filter: $tag_filter,
                        use_custom_tags: "true"
                      }]
                    else
                      [
                        $browsers[] as $browser
                        | {
                            branch: $branch,
                            browser: $browser,
                            shard: "custom",
                            test_layer: $test_layer,
                            tag_filter: $tag_filter,
                            use_custom_tags: "true"
                          }
                      ]
                    end
                  )
                }
                ' > matrix.json
            elif [[ "${{ inputs.viewport_mobile_only }}" == "true" ]]; then
              MOBILE_TAG_FILTER="$(append_not_ignore '@mobile')"
              jq -n \
                --arg branch "$BRANCH" \
                --argjson browsers "$BROWSERS_JSON" \
                --arg tag_filter "$MOBILE_TAG_FILTER" \
                '
                {
                  include: [
                    $browsers[] as $browser
                    | {
                        branch: $branch,
                        browser: $browser,
                        shard: "mobile",
                        test_layer: "ui",
                        tag_filter: $tag_filter,
                        use_custom_tags: false
                      }
                  ]
                }
                ' > matrix.json
            elif [[ "${{ inputs.run_all_in_one_job }}" == "true" ]]; then
              TAG_FILTER="$(append_not_ignore '')"
              jq -n \
                --arg branch "$BRANCH" \
                --argjson browsers "$BROWSERS_JSON" \
                --arg tag_filter "$TAG_FILTER" \
                '
                {
                  include: [
                    $browsers[] as $browser
                    | {
                        branch: $branch,
                        browser: $browser,
                        shard: "all",
                        test_layer: "both",
                        tag_filter: $tag_filter,
                        use_custom_tags: false
                      }
                  ]
                }
                ' > matrix.json
            else
              jq -n \
                --arg branch "$BRANCH" \
                --argjson browsers "$BROWSERS_JSON" \
                --arg admin "$(append_not_ignore '@zmsadmin')" \
                --arg citizenview "$(append_not_ignore '@zmscitizenview')" \
                --arg statistic "$(append_not_ignore '@zmsstatistic')" \
                --arg ticketprinter "$(append_not_ignore '@zmsticketprinter')" \
                --arg calldisplay "$(append_not_ignore '@zmscalldisplay')" \
                --arg zmsapi "$(append_not_ignore '@zmsapi')" \
                --arg zmscitizenapi "$(append_not_ignore '@zmscitizenapi')" \
                --argjson module_admin "${{ inputs.module_admin }}" \
                --argjson module_citizenview "${{ inputs.module_citizenview }}" \
                --argjson module_statistic "${{ inputs.module_statistic }}" \
                --argjson module_ticketprinter "${{ inputs.module_ticketprinter }}" \
                --argjson module_calldisplay "${{ inputs.module_calldisplay }}" \
                --argjson module_zmsapi "${{ inputs.module_zmsapi }}" \
                --argjson module_zmscitizenapi "${{ inputs.module_zmscitizenapi }}" \
                '
                {
                  include: (
                    [
                      [
                        if $module_admin then
                          {shard: "zmsadmin", test_layer: "ui", tag_filter: $admin, use_custom_tags: false}
                        else empty end,
                        if $module_citizenview then
                          {shard: "zmscitizenview", test_layer: "ui", tag_filter: $citizenview, use_custom_tags: false}
                        else empty end,
                        if $module_statistic then
                          {shard: "zmsstatistic", test_layer: "ui", tag_filter: $statistic, use_custom_tags: false}
                        else empty end,
                        if $module_ticketprinter then
                          {shard: "zmsticketprinter", test_layer: "ui", tag_filter: $ticketprinter, use_custom_tags: false}
                        else empty end,
                        if $module_calldisplay then
                          {shard: "zmscalldisplay", test_layer: "ui", tag_filter: $calldisplay, use_custom_tags: false}
                        else empty end
                      ][] as $shard
                      | $browsers[] as $browser
                      | $shard + {branch: $branch, browser: $browser}
                    ]
                    + [
                      [
                        if $module_zmsapi then
                          {shard: "zmsapi", test_layer: "api", tag_filter: $zmsapi, use_custom_tags: false}
                        else empty end,
                        if $module_zmscitizenapi then
                          {shard: "zmscitizenapi", test_layer: "api", tag_filter: $zmscitizenapi, use_custom_tags: false}
                        else empty end
                      ][] as $shard
                      | $shard + {branch: $branch, browser: $browsers[0]}
                    ]
                  )
                }
                ' > matrix.json

              SHARD_COUNT="$(jq '.include | length' matrix.json)"
              if [[ "$SHARD_COUNT" -eq 0 ]]; then
                echo "No modules selected. Enable run_all_in_one_job, use_custom_tags, or at least one module checkbox."
                exit 1
              fi
            fi
            echo "max_parallel=$(jq '.include | length' matrix.json)" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$FULL_MATRIX" == true ]]; then
            jq '.include |= map(. + {job_name: (if .test_layer == "api" then "\(.branch) · \(.shard)" else "\(.branch) · \(.shard) · \(.browser)" end)})' matrix.json > matrix.tmp.json
          else
            jq '.include |= map(. + {job_name: (if .test_layer == "api" then .shard else "\(.shard) · \(.browser)" end)})' matrix.json > matrix.tmp.json
          fi
          mv matrix.tmp.json matrix.json

          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          jq . matrix.json

  zms-automation:
    name: ${{ matrix.job_name }}
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.generate-matrix.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Create runtime env file
        run: cp .devcontainer/.env.template .devcontainer/.env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${{ matrix.branch }}"

          SANITIZED="$(echo "$REF_NAME" | sed 's/[\/:]/-/g')"
          PHP_TAG="branch-${SANITIZED}"
          BRANCH_SLUG="$SANITIZED"

          {
            echo "branch_name=$REF_NAME"
            echo "branch_slug=$BRANCH_SLUG"
            echo "php_tag=$PHP_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Pull prebuilt PHP module images
        shell: bash
        run: |
          set -euo pipefail
          PHP_TAG="${{ steps.tags.outputs.php_tag }}"
          FALLBACK_TAG="branch-next"
          modules=(zmsadmin zmsbackend zmscalldisplay zmscitizenapi zmsmessaging zmsstatistic zmsticketprinter)
          tags_file="${RUNNER_TEMP}/module-image-tags"
          : > "$tags_file"

          # A branch image exists only after that module's PHP image build finishes.
          # Until then, use the latest next image for that module.
          pull_image() {
            local ref="$1"
            local log attempt
            for attempt in 1 2 3; do
              if log="$(docker pull --quiet "$ref" 2>&1)"; then
                printf '%s\n' "$log"
                return 0
              fi
              printf '%s\n' "$log" >&2
              if grep -Eqi 'not found|manifest unknown|name unknown' <<<"$log"; then
                return 2
              fi
              echo "Pull of ${ref} failed (attempt ${attempt}/3)." >&2
              sleep $((attempt * 15))
            done
            return 1
          }

          for m in "${modules[@]}"; do
            image="ghcr.io/${GITHUB_REPOSITORY}/${m}"
            tag="$PHP_TAG"
            rc=0
            pull_image "${image}:${tag}" || rc=$?
            if [[ "$rc" -eq 2 && "$tag" != "$FALLBACK_TAG" ]]; then
              echo "No image ${image}:${tag} yet; using ${FALLBACK_TAG}"
              tag="$FALLBACK_TAG"
              pull_image "${image}:${tag}"
            elif [[ "$rc" -ne 0 ]]; then
              echo "Failed to pull ${image}:${PHP_TAG}"
              exit 1
            fi
            echo "${m} ${tag}" >> "$tags_file"
            echo "Resolved ${m} -> ${tag}"
          done

      - name: Start required containers (stack once)
        shell: bash
        run: |
          set -euo pipefail

          cd .devcontainer

          # Ten shards pull these images at once. A dropped layer is "unexpected EOF"
          # and used to fail the job before any test ran. Retry the pull; quiet
          # progress so a redraw is not thousands of log lines.
          compose() {
            docker compose --progress quiet -f docker-compose.yaml "$@"
          }
          services=(web db citizenview refarch-gateway keycloak init-keycloak captcha-db captchaservice)
          pulled=0
          for attempt in 1 2 3; do
            if compose pull "${services[@]}"; then
              pulled=1
              break
            fi
            echo "Stack image pull failed (attempt ${attempt}/3)."
            sleep $((attempt * 15))
          done
          if [[ "$pulled" -ne 1 ]]; then
            echo "Stack image pull failed after 3 attempts."
            exit 1
          fi

          compose down -v --remove-orphans || true
          compose up -d "${services[@]}"

          captcha_ready=""
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:39146/actuator/health >/dev/null 2>&1; then
              echo "captchaservice is healthy."
              captcha_ready=1
              break
            fi
            sleep 2
          done
          if [ -z "${captcha_ready}" ]; then
            echo "captchaservice did not become healthy in time."
            docker logs zms-captchaservice || true
            docker logs zms-captcha-db || true
            exit 1
          fi

          exit_code=""
          for _ in {1..60}; do
            state="$(docker inspect -f '{{.State.Status}}' zms-init-keycloak 2>/dev/null || echo missing)"
            if [ "$state" = "exited" ]; then
              exit_code="$(docker inspect -f '{{.State.ExitCode}}' zms-init-keycloak)"
              echo "init-keycloak finished with exit code ${exit_code}."
              docker logs zms-init-keycloak || true
              break
            fi
            sleep 2
          done
          if [ -z "${exit_code}" ]; then
            echo "init-keycloak did not exit in time."
            docker logs zms-init-keycloak || true
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "Keycloak migration failed (exit ${exit_code})."
            exit 1
          fi

      - name: Install missing tooling inside web container
        shell: bash
        run: |
          set -euo pipefail
          WEB_CONT="zms-web"
          TARGET_BROWSER="${{ matrix.browser }}"

          docker exec -u root -e TARGET_BROWSER="$TARGET_BROWSER" "$WEB_CONT" bash -lc '
            set -euo pipefail

            fetch_url() {
              local url="$1"
              local dest="$2"
              local attempt
              for attempt in 1 2 3 4 5; do
                if curl -fsSL -o "$dest" "$url"; then
                  return 0
                fi
                echo "Download failed (attempt ${attempt}/5): ${url}" >&2
                rm -f "$dest"
                if [ "$attempt" -lt 5 ]; then
                  sleep $((attempt * 5))
                fi
              done
              echo "Download failed after 5 attempts: ${url}" >&2
              return 1
            }

            apt-get update

            # ATAF 0.3.4 ships Selenium 4.46, which speaks Chrome DevTools protocol
            # 148-150. Do not fall back to the newer Debian security Chromium.
            # ChromeDriver then times out with "Timed out receiving message from renderer".
            # Same pin as zmsbase/php83-local and zmsbase/php84-local.
            CHROMIUM_APT_VERSION="150.0.7871.181-1~deb13u1"
            if ! apt-get install -s -y --allow-downgrades \
              "chromium-common=${CHROMIUM_APT_VERSION}" \
              "chromium=${CHROMIUM_APT_VERSION}" \
              "chromium-driver=${CHROMIUM_APT_VERSION}" \
              >/dev/null 2>&1; then
              echo "Pinned Chromium ${CHROMIUM_APT_VERSION} is not installable."
              apt-cache policy chromium || true
              exit 1
            fi
            apt-get install -y --no-install-recommends --allow-downgrades \
              curl wget unzip ca-certificates gnupg \
              mariadb-client \
              x11-utils x11-xserver-utils \
              xvfb \
              firefox-esr \
              "chromium-common=${CHROMIUM_APT_VERSION}" \
              "chromium=${CHROMIUM_APT_VERSION}" \
              "chromium-driver=${CHROMIUM_APT_VERSION}" \
              ;
            apt-mark hold chromium chromium-driver chromium-common
            dpkg-query -W -f="chromium=%Version\n" chromium chromium-driver
            chromedriver --version

            ln -sf /usr/bin/firefox-esr /usr/bin/firefox || true

            if [[ "${TARGET_BROWSER:-}" == "edge" ]]; then
              mkdir -p /etc/apt/keyrings
              rm -f /etc/apt/keyrings/microsoft.gpg
              fetch_url https://packages.microsoft.com/keys/microsoft.asc /tmp/microsoft.asc
              gpg --batch --yes --no-tty --dearmor -o /etc/apt/keyrings/microsoft.gpg /tmp/microsoft.asc
              rm -f /tmp/microsoft.asc
              echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
                > /etc/apt/sources.list.d/microsoft-edge.list
              apt-get update
              apt-get install -y --no-install-recommends microsoft-edge-stable

              EDGE_VERSION="$(microsoft-edge --version | awk "{print \$3}")"
              EDGE_VERSION="${EDGE_VERSION%%-*}"
              fetch_url \
                "https://msedgedriver.microsoft.com/${EDGE_VERSION}/edgedriver_linux64.zip" \
                /tmp/msedgedriver.zip
              unzip -o /tmp/msedgedriver.zip -d /tmp
              mv /tmp/msedgedriver /usr/local/bin/msedgedriver
              chmod +x /usr/local/bin/msedgedriver
              rm -f /tmp/msedgedriver.zip
            fi

            if ! command -v geckodriver >/dev/null 2>&1; then
              GECKODRIVER_VERSION="v0.36.0"
              fetch_url \
                "https://github.com/mozilla/geckodriver/releases/download/${GECKODRIVER_VERSION}/geckodriver-${GECKODRIVER_VERSION}-linux64.tar.gz" \
                /tmp/geckodriver.tar.gz
              tar -xzf /tmp/geckodriver.tar.gz -C /tmp
              mv /tmp/geckodriver /usr/local/bin/geckodriver
              chmod +x /usr/local/bin/geckodriver
              rm -f /tmp/geckodriver.tar.gz
            fi

            if ! command -v mvn >/dev/null 2>&1; then
              apt-get install -y --no-install-recommends gnupg
              rm -f /usr/share/keyrings/adoptium.gpg
              fetch_url https://packages.adoptium.net/artifactory/api/gpg/key/public /tmp/adoptium.asc
              gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/adoptium.gpg /tmp/adoptium.asc
              rm -f /tmp/adoptium.asc
              echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(. /etc/os-release && echo $VERSION_CODENAME) main" \
                > /etc/apt/sources.list.d/adoptium.list
              apt-get update
              apt-get install -y --no-install-recommends temurin-21-jdk

              export JAVA_HOME="/usr/lib/jvm/temurin-21-jdk-$(dpkg --print-architecture)"
              export PATH="$JAVA_HOME/bin:$PATH"

              MAVEN_VERSION="3.9.12"
              fetch_url \
                "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
                /tmp/maven.tar.gz
              fetch_url \
                "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512" \
                /tmp/maven.tar.gz.sha512
              echo "$(cat /tmp/maven.tar.gz.sha512)  /tmp/maven.tar.gz" | sha512sum -c - \
                && tar -xzf /tmp/maven.tar.gz -C /opt \
                && ln -s /opt/apache-maven-${MAVEN_VERSION}/bin/mvn /usr/local/bin/mvn
              rm -f /tmp/maven.tar.gz /tmp/maven.tar.gz.sha512
            fi

            echo "Tooling setup complete."
          '

      - name: Inject prebuilt module directories into zms-web
        shell: bash
        run: |
          set -euo pipefail
          WEB_CONT="zms-web"
          tags_file="${RUNNER_TEMP}/module-image-tags"
          modules=(zmsadmin zmsbackend zmscalldisplay zmscitizenapi zmsmessaging zmsstatistic zmsticketprinter)
          layout_modules=(zmsadmin zmsstatistic)

          tag_for() {
            local module="$1"
            awk -v module="$module" '$1 == module { print $2; exit }' "$tags_file"
          }

          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "All ${max_attempts} attempts failed."
                return 1
              fi
              echo "Attempt ${attempt} failed; retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          echo "Ensuring zmslayout is available at $WEB_CONT:/var/www/html/zmslayout"
          if ! docker exec -u root "$WEB_CONT" bash -lc 'test -d /var/www/html/zmslayout/js && test -d /var/www/html/zmslayout/scss'; then
            echo "zmslayout not on bind mount; streaming via tar"
            docker exec -u root "$WEB_CONT" bash -lc "mkdir -p /var/www/html/zmslayout"
            # WEB_CONT is passed via env so the inner shell can expand it.
            # shellcheck disable=SC2016
            retry 3 10 env WEB_CONT="$WEB_CONT" bash -c 'tar cf - -C ./zmslayout . | docker exec -i -u root "$WEB_CONT" tar -xf - -C /var/www/html/zmslayout/'
          fi

          inject_module() {
            local m="$1"
            local tag
            tag="$(tag_for "$m")"
            if [[ -z "$tag" ]]; then
              echo "No resolved image tag for ${m}"
              return 1
            fi
            echo "Injecting $m from GHCR image tag $tag into $WEB_CONT:/var/www/html/$m"
            docker exec -u root "$WEB_CONT" bash -lc "mkdir -p /var/www/html/${m}"

            if [[ " ${layout_modules[*]} " == *" ${m} "* ]]; then
              docker run --rm \
                -v "${GITHUB_WORKSPACE}/zmslayout:/var/www/zmslayout:ro" \
                "ghcr.io/${GITHUB_REPOSITORY}/${m}:${tag}" \
                bash -lc 'set -euo pipefail
                  cd /var/www/html
                  for spec in bo-zms-layout-js:js bo-zms-layout-scss:scss; do
                    name="${spec%%:*}"
                    dir="${spec##*:}"
                    if [[ -L "node_modules/${name}" ]]; then
                      rm -f "node_modules/${name}"
                      cp -a "/var/www/zmslayout/${dir}" "node_modules/${name}"
                    fi
                  done
                  tar cf - -C /var/www/html .' \
                | docker exec -i -u root "$WEB_CONT" tar -xf - -C "/var/www/html/${m}/"
            else
              docker run --rm --entrypoint tar "ghcr.io/${GITHUB_REPOSITORY}/${m}:${tag}" \
                -cf - -C /var/www/html . \
                | docker exec -i -u root "$WEB_CONT" tar -xf - -C "/var/www/html/${m}/"
            fi

            docker exec -u root "$WEB_CONT" bash -lc "chown -R www-data:www-data /var/www/html/${m} 2>/dev/null || true; chmod -R 755 /var/www/html/${m} 2>/dev/null || true"
          }

          for m in "${modules[@]}"; do
            retry 3 10 inject_module "$m"
          done

          docker exec -u root "$WEB_CONT" bash -lc "chown -R www-data:www-data /var/www/html/zmslayout 2>/dev/null || true; chmod -R 755 /var/www/html/zmslayout 2>/dev/null || true"

      - name: Ensure writable cache directories
        shell: bash
        run: |
          set -euo pipefail
          WEB_CONT="zms-web"
          docker exec -u root "$WEB_CONT" bash -lc '
            set -euo pipefail
            mkdir -p /var/www/html/cache
            chown -R www-data:www-data /var/www/html/cache 2>/dev/null || true
            chmod -R 777 /var/www/html/cache 2>/dev/null || true

            # Module cache dirs (local devcontainer does similar in postStartCommand)
            for dir in zmsadmin zmsbackend zmscalldisplay zmscitizenapi zmsstatistic zmsticketprinter zmsmessaging; do
              mkdir -p "/var/www/html/$dir/cache"
              chown -R www-data:www-data "/var/www/html/$dir/cache" 2>/dev/null || true
              chmod -R 777 "/var/www/html/$dir/cache" 2>/dev/null || true
            done
          '

      - name: Run zmsautomation ATAF tests
        shell: bash
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          MATRIX_TEST_LAYER: ${{ matrix.test_layer }}
          MATRIX_TAG_FILTER: ${{ matrix.tag_filter }}
          MATRIX_USE_CUSTOM_TAGS: ${{ matrix.use_custom_tags }}
          CUSTOM_TAG_INPUT: ${{ inputs.cucumber_tag_expressions }}
          SCREENSHOT: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.per_step_screenshots || 'false') }}
          ATAF_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ataf_version || '' }}
          SERIAL_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.serial_scenarios || 'false' }}
        run: |
          set -euo pipefail

          WEB_CONT="zms-web"
          BROWSER="${{ matrix.browser }}"
          TEST_LAYER="$MATRIX_TEST_LAYER"

          case "$TEST_LAYER" in
            api) PROFILES=(-Pataf-api) ;;
            ui) PROFILES=(-Pataf-ui) ;;
            both) PROFILES=(-Pataf-api -Pataf-ui) ;;
            *)
              echo "Unknown test layer: $TEST_LAYER"
              exit 1
              ;;
          esac

          EXTRA_MVN_ARGS=()
          if [[ -n "${ATAF_VERSION//[[:space:]]/}" ]]; then
            ATAF_VERSION="$(printf '%s' "$ATAF_VERSION" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            EXTRA_MVN_ARGS+=("-Dataf.version=${ATAF_VERSION}")
            echo "Using ATAF version override: ${ATAF_VERSION}"
          else
            echo "Using ATAF version from zmsautomation/pom.xml (ataf.version)"
          fi

          if [[ "$SERIAL_SCENARIOS" == "true" ]]; then
            EXTRA_MVN_ARGS+=("-Ddataproviderthreadcount=1")
            echo "Scenarios run one at a time (dataproviderthreadcount=1)"
          fi

          append_not_ignore() {
            local expr="$1"
            if [[ -z "$expr" ]]; then
              printf '%s' "not @ignore"
            else
              printf '%s' "(${expr}) and not @ignore"
            fi
          }

          TAG_LINES=()
          USE_CUSTOM_TAGS=false
          if [[ "$MATRIX_USE_CUSTOM_TAGS" == "true" ]]; then
            USE_CUSTOM_TAGS=true
          elif [[ -n "$(printf '%s' "$CUSTOM_TAG_INPUT" | tr -d '[:space:]')" ]]; then
            USE_CUSTOM_TAGS=true
          fi

          CUSTOM_SOURCE="$CUSTOM_TAG_INPUT"
          if [[ -z "$(printf '%s' "$CUSTOM_SOURCE" | tr -d '[:space:]')" ]]; then
            CUSTOM_SOURCE="$MATRIX_TAG_FILTER"
          fi

          if [[ "$USE_CUSTOM_TAGS" == "true" ]]; then
            if [[ -z "$(printf '%s' "$CUSTOM_SOURCE" | tr -d '[:space:]')" ]]; then
              TAG_LINES=("")
            else
              while IFS= read -r line; do
                line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [[ -n "$line" ]] && TAG_LINES+=("$line")
              done <<< "$CUSTOM_SOURCE"
              [[ ${#TAG_LINES[@]} -eq 0 ]] && TAG_LINES=("")
            fi
          else
            TAG_LINES=("$MATRIX_TAG_FILTER")
          fi

          fail_any=0
          for expr in "${TAG_LINES[@]}"; do
            expr="$(printf '%s' "$expr" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [[ "$USE_CUSTOM_TAGS" == "true" ]]; then
              if [[ -n "$expr" ]]; then
                if [[ "$expr" == *"@ignore"* ]]; then
                  final_expr="$expr"
                else
                  final_expr="$(append_not_ignore "$expr")"
                fi
              else
                final_expr="not @ignore"
              fi
            else
              final_expr="$expr"
            fi

            if [[ -n "$final_expr" ]]; then
              echo "Running zmsautomation-test shard=${MATRIX_SHARD} layer=${TEST_LAYER} tags: ${final_expr}"
            else
              echo "Running zmsautomation-test shard=${MATRIX_SHARD} layer=${TEST_LAYER}, all tests (not @ignore)"
              final_expr="not @ignore"
            fi

            set +e
            docker exec -u root "$WEB_CONT" bash -lc '
              set -euo pipefail
              set -a
              source /var/www/html/.devcontainer/.env
              tags="$1"
              SCREENSHOT_EVERY_STEP="$2"
              ZMS_BROWSER="$3"
              shift 3

              args=("$@")
              if [[ -n "$tags" ]]; then
                args+=("-Dcucumber.filter.tags=$tags")
              fi

              bash /var/www/html/zmsautomation/zmsautomation-test "${args[@]}"
            ' -- "$final_expr" "$SCREENSHOT" "$BROWSER" "${PROFILES[@]}" ${EXTRA_MVN_ARGS[@]+"${EXTRA_MVN_ARGS[@]}"}
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "Run failed (exit $rc): shard=${MATRIX_SHARD}, layer=${TEST_LAYER}, tags=${final_expr}"
              fail_any=1
            fi
          done

          if [ "$fail_any" -ne 0 ]; then
            echo "At least one test run failed."
            exit 1
          fi

      - name: Write branch meta for status publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg branch "${{ steps.tags.outputs.branch_name }}" \
            --arg slug "${{ steps.tags.outputs.branch_slug }}" \
            --arg shard "${{ matrix.shard }}" \
            --arg browser "${{ matrix.browser }}" \
            '{branch: $branch, branchSlug: $slug, shard: $shard, browser: $browser}' \
            > branch-meta.json

      - name: Upload test reports (best effort)
        id: upload-test-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-ataf-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: |
            zmsautomation/target/cucumber.json
            zmsautomation/target/cucumber-api.json
            branch-meta.json
            zmsautomation/target/site/cucumber-pretty/**
            zmsautomation/target/surefire-reports/**
            zmsautomation/target/surefire-reports-api/**
            zmsautomation/target/screenshots/**
          if-no-files-found: warn
          overwrite: true

      - name: Wait before retrying test report upload (1/3)
        if: always() && steps.upload-test-reports.outcome == 'failure'
        run: sleep 20

      - name: Retry upload test reports (1/3)
        id: upload-test-reports-retry-1
        if: always() && steps.upload-test-reports.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-ataf-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: |
            zmsautomation/target/cucumber.json
            zmsautomation/target/cucumber-api.json
            branch-meta.json
            zmsautomation/target/site/cucumber-pretty/**
            zmsautomation/target/surefire-reports/**
            zmsautomation/target/surefire-reports-api/**
            zmsautomation/target/screenshots/**
          if-no-files-found: warn
          overwrite: true

      - name: Wait before retrying test report upload (2/3)
        if: always() && steps.upload-test-reports-retry-1.outcome == 'failure'
        run: sleep 20

      - name: Retry upload test reports (2/3)
        id: upload-test-reports-retry-2
        if: always() && steps.upload-test-reports-retry-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-ataf-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: |
            zmsautomation/target/cucumber.json
            zmsautomation/target/cucumber-api.json
            branch-meta.json
            zmsautomation/target/site/cucumber-pretty/**
            zmsautomation/target/surefire-reports/**
            zmsautomation/target/surefire-reports-api/**
            zmsautomation/target/screenshots/**
          if-no-files-found: warn
          overwrite: true

      - name: Wait before retrying test report upload (3/3)
        if: always() && steps.upload-test-reports-retry-2.outcome == 'failure'
        run: sleep 20

      - name: Retry upload test reports (3/3)
        if: always() && steps.upload-test-reports-retry-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-ataf-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: |
            zmsautomation/target/cucumber.json
            zmsautomation/target/cucumber-api.json
            branch-meta.json
            zmsautomation/target/site/cucumber-pretty/**
            zmsautomation/target/surefire-reports/**
            zmsautomation/target/surefire-reports-api/**
            zmsautomation/target/screenshots/**
          if-no-files-found: warn
          overwrite: true

      - name: Collect docker container logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/container-logs

          docker ps -a > artifacts/container-logs/docker-ps-a.txt 2>&1 || true

          containers=(
            zms-web
            zms-citizenview
            zms-db
            zms-keycloak
            zms-refarch-gateway
            zms-init-keycloak
            zms-captchaservice
            zms-captcha-db
          )

          for c in "${containers[@]}"; do
            if docker inspect "$c" >/dev/null 2>&1; then
              docker logs "$c" > "artifacts/container-logs/${c}.log" 2>&1 || true
              docker inspect "$c" > "artifacts/container-logs/${c}.inspect.json" 2>/dev/null || true
            fi
          done

          # One compressed file: smaller blob and a single CreateArtifact payload.
          tar -C artifacts -czf artifacts/container-logs.tar.gz container-logs
          rm -rf artifacts/container-logs

          # Stagger matrix shards so concurrent CreateArtifact calls are less likely
          # to hit the same GitHub artifact API timeout.
          sleep $((5 + RANDOM % 25))

      - name: Upload container logs
        id: upload-container-logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-container-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: artifacts/container-logs.tar.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Wait before retrying container log upload (1/3)
        if: always() && steps.upload-container-logs.outcome == 'failure'
        run: sleep 20

      - name: Retry upload container logs (1/3)
        id: upload-container-logs-retry-1
        if: always() && steps.upload-container-logs.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-container-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: artifacts/container-logs.tar.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Wait before retrying container log upload (2/3)
        if: always() && steps.upload-container-logs-retry-1.outcome == 'failure'
        run: sleep 20

      - name: Retry upload container logs (2/3)
        id: upload-container-logs-retry-2
        if: always() && steps.upload-container-logs-retry-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-container-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: artifacts/container-logs.tar.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Wait before retrying container log upload (3/3)
        if: always() && steps.upload-container-logs-retry-2.outcome == 'failure'
        run: sleep 20

      - name: Retry upload container logs (3/3)
        if: always() && steps.upload-container-logs-retry-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmsautomation-container-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.tags.outputs.branch_slug }}-${{ matrix.shard }}-${{ matrix.browser }}
          path: artifacts/container-logs.tar.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish-cucumber-status:
    name: Publish cucumber status JSON
    needs: zms-automation
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download cucumber reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: zmsautomation-ataf-reports-*
          path: cucumber-reports
          merge-multiple: false

      - name: Build public cucumber status JSON
        id: status
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_STARTED_AT="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r '.run_started_at // empty')"
          export RUN_STARTED_AT
          mkdir -p "${RUNNER_TEMP}/previous-status" "${RUNNER_TEMP}/cucumber-status"
          if git fetch origin zmsautomation-status:zmsautomation-status 2>/dev/null; then
            while read -r file; do
              git show "zmsautomation-status:${file}" \
                > "${RUNNER_TEMP}/previous-status/$(basename "${file}")"
            done < <(git ls-tree -r --name-only zmsautomation-status | grep -E '\.json$' || true)
          fi
          export PREVIOUS_STATUS_DIR="${RUNNER_TEMP}/previous-status"
          if node docs/.vitepress/scripts/build-cucumber-run-status.mjs \
            cucumber-reports \
            "${RUNNER_TEMP}/cucumber-status"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "No cucumber.json reports to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish status JSON to zmsautomation-status
        if: steps.status.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin zmsautomation-status:zmsautomation-status 2>/dev/null || true

          if git show-ref --verify --quiet refs/heads/zmsautomation-status; then
            git switch zmsautomation-status
          else
            git switch --orphan zmsautomation-status
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi

          cp "${RUNNER_TEMP}/cucumber-status"/*.json .
          cat > README.md <<'EOF'
          # zmsautomation cucumber status

          Public JSON for the docs catalog. One file per tested branch
          slug (`next.json`, `main.json`, …). `index.json` lists branches
          that have a published zmsautomation run. `cucumber-run-status.json`
          is a copy of `next.json`. Generated from zmsautomation runs.
          Do not edit by hand.
          EOF

          git add README.md ./*.json
          if git diff --staged --quiet; then
            echo "Status JSON unchanged"
            exit 0
          fi
          git commit -m "docs(ZMS): publish cucumber status from run ${GITHUB_RUN_ID}"
          git push origin HEAD:zmsautomation-status
