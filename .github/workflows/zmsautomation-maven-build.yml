name: ☕ zmsautomation-maven-build

on:
  pull_request:
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"
  push:
    # All branches. No paths: filter — new feature branches must run once even
    # without zmsautomation/ changes. should-run gates later pushes.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/next' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  should-run:
    name: Decide ATAF Maven
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          THIS_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: zmsautomation-maven-build.yml
          MODE: include
          PATH_PREFIXES: zmsautomation/ .github/workflows/zmsautomation-maven-build.yml
        run: |
          # PRs keep path filtering via on.pull_request.paths; always build.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Run: pull_request"
            exit 0
          fi
          bash .github/scripts/decide-push-ci-run.sh

  build:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          app-path: zmsautomation
          java-version: "21"
