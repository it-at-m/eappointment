name: ☕ zmsautomation-maven-build

on:
  pull_request:
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"
  push:
    branches:
      - next
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        with:
          app-path: zmsautomation
          java-version: "21"
