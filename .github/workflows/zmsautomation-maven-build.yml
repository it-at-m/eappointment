name: ☕ zmsautomation-maven-build

on:
  pull_request:
  push:
    branches: [main, next]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@2bb2618a4686a01cc54518c07d9052b80b9a1078 # v1.5.2
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@2bb2618a4686a01cc54518c07d9052b80b9a1078 # v1.5.2
        with:
          app-path: zmsautomation
          java-version: "21"
