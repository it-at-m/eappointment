name: ☕ zmsautomation-maven-build

on:
  pull_request:
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"
  push:
    branches:
      - next
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          app-path: zmsautomation
          java-version: "21"
