name: ☕ zmsautomation-maven-build

on:
  pull_request:
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"
  push:
    branches:
      - next
    paths:
      - "zmsautomation/**"
      - ".github/workflows/zmsautomation-maven-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          app-path: zmsautomation
          java-version: "21"
