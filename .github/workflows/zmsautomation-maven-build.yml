name: ☕ zmsautomation-maven-build

on:
  pull_request:
  push:
    branches: [main, next]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          app-path: zmsautomation
          java-version: "21"
