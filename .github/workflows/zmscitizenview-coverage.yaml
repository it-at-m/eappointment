permissions:
  contents: read
  actions: write
name: 📊 ZMSCitizenView Coverage

on:
  workflow_call:
    outputs:
      zmscitizenview-test-result:
        description: "ZMSCitizenView test result"
        value: ${{ jobs.zmscitizenview-test.outputs.result }}

jobs:
  zmscitizenview-test:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: zmscitizenview/package-lock.json

      # package.json keeps the stable pin for main/tags; other refs test against npm "beta".
      - name: Select muc-patternlab-vue channel
        run: bash .github/scripts/zmscitizenview-select-patternlab.sh zmscitizenview

      - name: Install dependencies
        run: |
          cd zmscitizenview
          npm ci

      - name: Configure Vitest for coverage
        run: |
          cd zmscitizenview
          # Create a temporary vitest config with coverage enabled
          cat > vitest.coverage.config.ts << 'EOL'
          import { defineConfig } from "vitest/config";
          import vue from "@vitejs/plugin-vue";
          import {fileURLToPath} from "node:url";

          export default defineConfig({
            plugins: [
              vue({
                features: {
                  customElement: true
                }
              })
            ],
            resolve: {
              alias: {
                "@": fileURLToPath(new URL("./src", import.meta.url)),
              },
            },
            test: {
              environment: "jsdom",
              globals: true,
              setupFiles: ["./tests/setup/localStorageMock.ts"],
              coverage: {
                provider: 'v8',
                reporter: ['html', 'json', 'lcov', 'text'],
                reportsDirectory: './coverage',
                exclude: [
                  'node_modules/',
                  'tests/',
                  'processes/',
                  '**/*.d.ts',
                  '**/*.config.*',
                  '**/*.test.*',
                  '**/*.spec.*'
                ]
              }
            }
          })
          EOL
      - name: Run tests with coverage
        run: |
          cd zmscitizenview
          mkdir -p coverage
          echo "Running tests with coverage for zmscitizenview"
          
          # Run tests with coverage using the temporary config
          npx vitest run --config vitest.coverage.config.ts --coverage
          
          # Clean up temporary config
          rm vitest.coverage.config.ts

      - name: Verify coverage output
        if: always()
        run: |
          cd zmscitizenview
          echo "=== Coverage directory contents ==="
          ls -la coverage/
          if [ -d "coverage/html" ]; then
            echo "=== HTML coverage files ==="
            ls -la coverage/html/
          fi
          if [ -f "coverage/lcov.info" ]; then
            echo "=== LCOV file exists ==="
            head -5 coverage/lcov.info
          fi

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-zmscitizenview
          path: zmscitizenview/coverage/
          retention-days: 1

      - name: Set job result
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"
