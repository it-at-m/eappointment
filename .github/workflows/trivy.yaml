name: 🛡️ Trivy Security Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - next

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🛡️ Trivy Security Check
    runs-on: ubuntu-latest
    env:
      TRIVY_SKIP_VERSION_CHECK: "true"
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Run Trivy Security check on Repository
        uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
