name: 🛡️ Trivy Security Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - next

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🛡️ Trivy Security Check
    runs-on: ubuntu-latest
    env:
      TRIVY_SKIP_VERSION_CHECK: "true"
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Run Trivy Security check on Repository
        uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
