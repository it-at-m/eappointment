name: 🛡️ Trivy Security Check

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - next

jobs:
  build:
    name: 🛡️ Trivy Security Check
    runs-on: ubuntu-latest
    env:
      TRIVY_SKIP_VERSION_CHECK: "true"
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Run Trivy Security check on Repository
        uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@2bb2618a4686a01cc54518c07d9052b80b9a1078 # v1.5.2
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
