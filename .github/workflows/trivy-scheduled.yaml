name: 🛡️ Trivy Security Check (scheduled)

on:
  schedule:
    # Scheduled workflows run on the default branch only; scan main and next explicitly.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  scheduled:
    name: 🛡️ Trivy Security Check (${{ matrix.branch }})
    runs-on: ubuntu-latest
    env:
      TRIVY_SKIP_VERSION_CHECK: "true"
    strategy:
      fail-fast: false
      matrix:
        branch: [main, next]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in repository mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: "1"
          timeout: 15m0s
          trivyignores: .trivyignore
          output: trivy-report.json

      - name: Convert Trivy report
        if: always() && hashFiles('trivy-report.json') != ''
        shell: bash
        env:
          # convert in 0.70.0 has no --skip-version-check; a set env maps to that flag and fails
          TRIVY_SKIP_VERSION_CHECK: ""
        run: |
          trivy convert --format table --output trivy-results.txt trivy-report.json
          cat trivy-results.txt
          trivy convert --format sarif --output trivy-results.sarif trivy-report.json

      - name: Upload vulnerability scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-report-${{ matrix.branch }}
          path: trivy-report.json
          retention-days: 7

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.branch }}

  notify-webex:
    name: 📣 Notify Webex on scheduled failure
    needs: scheduled
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Webex
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg roomId "$WEBEX_ROOM_ID" \
            --arg repo "${{ github.repository }}" \
            --arg runId "$RUN_ID" \
            --arg url "$RUN_URL" \
            '{roomId: $roomId, markdown: ("**Trivy scheduled security check failed in " + $repo + "**\n\n**Run:** `" + $runId + "`\n\n[View failed workflow](" + $url + ")")}' \
            | curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $WEBEX_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d @- \
              "https://webexapis.com/v1/messages"
          echo "Webex notification sent:"
          echo "  Run: ${RUN_ID}"
          echo "  ${RUN_URL}"
