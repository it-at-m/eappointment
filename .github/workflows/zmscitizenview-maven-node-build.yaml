name: 📱 Frontend Build zmscitizenview

on:
  push:
    # No paths: filter — would skip new branches that only touch PHP/ATAF.
    # should-run: new branch always; later only zmscitizenview/ (or catch-up).
  # Rebuild without a commit. In Actions, choose the branch under "Use workflow from",
  # the same way as the zmsautomation workflow.
  # next and feature branches install the npm "beta" dist-tag; main and tags keep the pin.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/next' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  should-run:
    name: Decide Frontend Build
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          THIS_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: zmscitizenview-maven-node-build.yaml
          MODE: include
          PATH_PREFIXES: zmscitizenview/ .github/workflows/zmscitizenview-maven-node-build.yaml
        run: bash .github/scripts/decide-push-ci-run.sh

  build:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-path: zmscitizenview
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
      # package.json keeps the stable pin for main/tags; other refs build against npm "beta".
      - name: Set up Node.js (patternlab channel)
        if: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Select muc-patternlab-vue channel
        if: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
        run: bash .github/scripts/zmscitizenview-select-patternlab.sh "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/package.json', matrix.app-path))!=null}}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          app-path: "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/pom.xml', matrix.app-path))!=null}}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          app-path: "${{ matrix.app-path }}"
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          path: "${{  matrix.app-path }}"
          image-name: "${{  matrix.app-path }}"
          artifact-name: ${{join(steps.*.outputs.artifact-name)}}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: ${{ github.ref_type == 'tag' && github.ref_name || format('branch-{0}', github.ref_name) }}
