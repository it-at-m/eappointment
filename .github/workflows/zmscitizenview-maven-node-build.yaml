name: 📱 Frontend Build zmscitizenview

on:
  push:
  # Rebuild without a commit, so a new @muenchen/muc-patternlab-vue beta is picked up.
  # Actions → this workflow → Run workflow.
  # Leave "branch" empty to build the ref chosen under "Use workflow from".
  # Or type any branch name (it does not have to contain this workflow file).
  # main keeps the pinned release; every other branch installs the npm "beta" dist-tag.
  # The image is published as branch-<name> (tags keep the tag name).
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to rebuild (empty = the branch selected above). Example: next"
        required: false
        default: ""
        type: string

concurrency:
  # Manual rebuild of a named branch queues with that branch.
  # next (push or manual, no override) shares one queue.
  # Every other push stays isolated per run.
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && inputs.branch != '' && format('refs/heads/{0}', inputs.branch)) || (github.ref == 'refs/heads/next' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-path: zmscitizenview
    steps:
      - name: Resolve ref to build
        id: target
        env:
          INPUT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$INPUT_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          branch="${branch#refs/heads/}"
          if [ -z "$branch" ]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "ref_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ref_type=${GITHUB_REF_TYPE}" >> "$GITHUB_OUTPUT"
            echo "custom=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$branch" | grep -Eq '^[A-Za-z0-9._/-]+$' \
            || printf '%s\n' "$branch" | grep -q '\.\.' \
            || printf '%s\n' "$branch" | grep -Eq '(^/|/$|//)'; then
            echo "Invalid branch name: ${branch}" >&2
            echo "Use a branch name such as next or feature-foo." >&2
            exit 1
          fi
          echo "ref=refs/heads/${branch}" >> "$GITHUB_OUTPUT"
          echo "ref_name=${branch}" >> "$GITHUB_OUTPUT"
          echo "ref_type=branch" >> "$GITHUB_OUTPUT"
          if [ "$branch" = "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            echo "custom=false" >> "$GITHUB_OUTPUT"
          else
            echo "custom=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout workflow ref
        if: steps.target.outputs.custom != 'true'
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
      - name: Checkout selected branch
        if: steps.target.outputs.custom == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      # package.json keeps the stable pin for main/tags; other refs build against npm "beta".
      - name: Set up Node.js (patternlab channel)
        if: ${{ !(steps.target.outputs.ref == 'refs/heads/main' || steps.target.outputs.ref_type == 'tag') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Select muc-patternlab-vue channel
        if: ${{ !(steps.target.outputs.ref == 'refs/heads/main' || steps.target.outputs.ref_type == 'tag') }}
        env:
          ZMS_BUILD_REF: ${{ steps.target.outputs.ref }}
          ZMS_BUILD_REF_TYPE: ${{ steps.target.outputs.ref_type }}
          ZMS_BUILD_EVENT_NAME: ${{ github.event_name }}
          # This workflow is push/dispatch only, so it is never a pull request into main.
          ZMS_BUILD_BASE_REF: ""
        run: bash .github/scripts/zmscitizenview-select-patternlab.sh "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/package.json', matrix.app-path))!=null}}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          app-path: "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/pom.xml', matrix.app-path))!=null}}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          app-path: "${{ matrix.app-path }}"
      - name: Build and push image
        if: steps.target.outputs.custom != 'true'
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          path: "${{  matrix.app-path }}"
          image-name: "${{  matrix.app-path }}"
          artifact-name: ${{join(steps.*.outputs.artifact-name)}}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: ${{ github.ref_type == 'tag' && github.ref_name || format('branch-{0}', github.ref_name) }}
      # action-build-image always checks out the workflow sha, so a manually
      # chosen branch has to build the image itself. Steps match that action at v1.6.0.
      - name: Checkout selected branch for image
        if: steps.target.outputs.custom == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - name: Download build artifact
        if: steps.target.outputs.custom == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ join(steps.*.outputs.artifact-name) }}
      - name: Set up QEMU
        if: steps.target.outputs.custom == 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        if: steps.target.outputs.custom == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GHCR
        if: steps.target.outputs.custom == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        if: steps.target.outputs.custom == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: "ghcr.io/${{ github.repository }}/${{ matrix.app-path }}"
          tags: ${{ format('branch-{0}', steps.target.outputs.ref_name) }}
          labels: |
            org.opencontainers.image.description=See ${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.description=See ${{ github.server_url }}/${{ github.repository }}
      - name: Build and push image for selected branch
        if: steps.target.outputs.custom == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.app-path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          github-token: ${{ github.token }}