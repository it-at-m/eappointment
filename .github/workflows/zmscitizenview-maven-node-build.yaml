name: 📱 Frontend Build zmscitizenview

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/next' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-path: zmscitizenview
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0
      # package.json keeps the stable pin for main/tags; other refs build against npm "beta".
      - name: Set up Node.js (patternlab channel)
        if: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Select muc-patternlab-vue channel
        if: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
        run: bash .github/scripts/zmscitizenview-select-patternlab.sh "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/package.json', matrix.app-path))!=null}}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0
        with:
          app-path: "${{ matrix.app-path }}"
      - if: ${{hashFiles(format('./{0}/pom.xml', matrix.app-path))!=null}}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0
        with:
          app-path: "${{ matrix.app-path }}"
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0
        with:
          path: "${{  matrix.app-path }}"
          image-name: "${{  matrix.app-path }}"
          artifact-name: ${{join(steps.*.outputs.artifact-name)}}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: ${{ github.ref_type == 'tag' && github.ref_name || format('branch-{0}', github.ref_name) }}