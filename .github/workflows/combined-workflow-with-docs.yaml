name: 🐘 Combined PHP Build with Documentation

on:
  push:
    branches: [next]
    # No paths-ignore (same reason as combined-workflow.yaml). should-run skips
    # zmsautomation/zmscitizenview-only pushes after next already has a success.
  # Rebuild next (incl. Pages) without a commit. Manual runs must use "Use workflow
  # from: next" — other branches use Combined PHP Build instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  actions: write

jobs:
  should-run:
    name: Decide Combined PHP with Docs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Manual runs only from next
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/next'
        run: |
          echo "::error::Combined PHP Build with Documentation can only be run manually from next. Use Combined PHP Build and pick your branch under Use workflow from."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          THIS_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: combined-workflow-with-docs.yaml
          MODE: ignore
          PATH_PREFIXES: zmsautomation/ zmscitizenview/
          # next is never a "new branch"; catch-up still applies if needed
          ALWAYS_ON_NEW_BRANCH: "true"
        run: bash .github/scripts/decide-push-ci-run.sh

  call-php-code-quality:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/php-code-quality.yaml

  call-js-eslint:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/js-eslint.yaml

  call-php-unit-tests:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/php-unit-tests.yaml

  call-zmscitizenview-coverage:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/zmscitizenview-coverage.yaml

  aggregate-reports:
    needs: [should-run, call-php-unit-tests, call-zmscitizenview-coverage]
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create directories
        run: |
          mkdir -p public/coverage

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'coverage-*'
          path: public/coverage-temp
          merge-multiple: false

      - name: Fix directory structure
        run: |
          MODULES="zmsadmin zmscalldisplay zmscitizenapi zmsdldb zmsentities zmsmessaging zmsslim zmsstatistic zmsticketprinter zmsbackend zmsclient zmscitizenview"
          # Fix coverage reports
          for module in $MODULES; do
            if [ -d "public/coverage-temp/coverage-$module" ]; then
              mkdir -p "public/coverage/coverage-$module"
              mv "public/coverage-temp/coverage-$module"/* "public/coverage/coverage-$module/"
            fi
          done
          rm -rf public/coverage-temp

      - name: Debug - List final structure
        run: |
          echo "=== Final Coverage Structure ==="
          ls -R public/coverage/

      - name: Upload aggregated reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aggregated-reports
          path: public/
          retention-days: 7

  call-build-api-docs:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/build-api-docs.yaml

  generate-schema-diagrams:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/generate-api-class-diagrams-from-zmsentities-schema.yaml

  generate-database-schema:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/generate-database-er-model.yaml

  deploy-to-pages:
    needs:
      [
        should-run,
        aggregate-reports,
        call-build-api-docs,
        generate-schema-diagrams,
        generate-database-schema,
      ]
    if: |
      needs.should-run.outputs.run == 'true' &&
      needs.call-build-api-docs.result == 'success' &&
      needs.aggregate-reports.result == 'success' &&
      needs.generate-schema-diagrams.result == 'success' &&
      needs.generate-database-schema.result == 'success'
    uses: ./.github/workflows/deploy-pages.yaml
    with:
      coverage_artifact: aggregated-reports
      api_docs_artifact: api-docs
      git_commit: ${{ github.sha }}
      git_branch: ${{ github.ref_name }}

  call-php-build-images:
    needs: [should-run, call-php-code-quality, call-js-eslint, call-php-unit-tests]
    if: |
      always() &&
      needs.should-run.outputs.run == 'true' &&
      needs.call-php-code-quality.result == 'success' &&
      needs.call-js-eslint.result == 'success' &&
      needs.call-php-unit-tests.result == 'success'
    uses: ./.github/workflows/php-build-images.yaml
