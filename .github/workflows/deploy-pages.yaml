name: 🚀 Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      coverage_artifact:
        description: 'Name of the coverage reports artifact'
        required: true
        type: string
      api_docs_artifact:
        description: 'Name of the API documentation artifact'
        required: true
        type: string
      git_commit:
        description: 'Git commit hash'
        required: true
        type: string
      git_branch:
        description: 'Git branch name'
        required: true
        type: string

permissions:
  pages: write
  id-token: write
  contents: read
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create public directory
        run: mkdir -p public

      - name: Download schema diagrams
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: schema-diagrams
          path: public/diagrams

      - name: Download database schema diagrams
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: database-schema-diagrams
          path: public/diagrams

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.coverage_artifact }}
          path: public

      - name: Download API docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.api_docs_artifact }}
          path: public

      - name: Setup Node for docs build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation handbook (site root)
        run: |
          npm ci --prefix docs
          npm run docs:build --prefix docs
          cp -R docs/.vitepress/dist/. public/

      - name: Debug - List directory structure
        run: |
          echo "=== Directory Structure ==="
          ls -R public/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # upload-pages-artifact can finalize before the Actions API lists the
      # artifact. deploy-pages looks the artifact up by name and fails closed
      # when that list is still empty (actions/deploy-pages#451).
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 2 5 10 20 40 40; do
            if [ "$delay" != "0" ]; then
              echo "github-pages artifact not listed yet; waiting ${delay}s"
              sleep "$delay"
            fi
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length')"
            echo "visible github-pages artifacts: ${count}"
            if [ "$count" = "1" ]; then
              exit 0
            fi
          done
          echo "::error::github-pages artifact was not visible to the Actions API in time"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
