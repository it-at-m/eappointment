id: add user_admin pool
author: ZMS Development
realm: zms
changes:
  # One Benutzerverwaltung account per department (ZMS role user_admin).
  # Technische Administration is system_admin. Terminadministration is appointment_admin.
  # The Keycloak role "user" only lets the account sign in. Flyway V42 assigns user_admin
  # and that account's department. A feature that says "user_admin" takes a free one at random.
  # Numbered in the same order as the departments, ataf_user_admin_1 onward.
  - addUser:
      name: ataf_user_admin_1
      lastName: Admin
      firstName: User
      enabled: true
      emailVerified: true
      email: ataf_user_admin_1@localhost
  - updateUserPassword:
      name: ataf_user_admin_1
      password: "vorschau"
  - assignRole:
      user: ataf_user_admin_1
      role: user
      clientId: zms
