version: '3.3'

services:
  mockup:
    image: jordimartin/mmock:v4.3.12@sha256:37df3c926fa8f19e786b28c96086bf4916e370e7f31cc8067a11c218340f6483
    volumes:
      - type: bind
        source: "./tests/mockup/config"
        target: "/config"
        consistency: cached
  test:
    depends_on:
      - mockup
    image: ghcr.io/it-at-m/eappointment/zmsbase:8.4-dev@sha256:7b38413cc0747352ebff26b39e7cd740b928eef0d0d96a82bceb01ef3feb2517
    volumes:
      - type: bind
        source: "."
        target: "/app"
        consistency: cached
      - type: bind
        source: "../zmsslim"
        target: "/zmsslim"
      - type: bind
        source: "../zmsentities"
        target: "/zmsentities"
      - type: bind
        source: "../mellon"
        target: "/mellon"
    environment:
      ZMS_API_URL: http://mockup:8083
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/conf.d:/tmp/php/conf.d"
    working_dir: /app
    command: >
      sh -c "
        mkdir -p /tmp/php/conf.d &&
        if [ \"$${XDEBUG_MODE:-off}\" != \"off\" ]; then
          echo 'zend_extension=xdebug.so' > /tmp/php/conf.d/xdebug.ini &&
          echo 'xdebug.mode=$${XDEBUG_MODE}' >> /tmp/php/conf.d/xdebug.ini &&
          echo 'xdebug.start_with_request=yes' >> /tmp/php/conf.d/xdebug.ini
        fi &&
        tail -f /dev/null
      "
