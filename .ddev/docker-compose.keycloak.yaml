services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    container_name: ddev-${DDEV_SITENAME}-keycloak
    command:
      - start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_DB=dev-file
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/plugins:/opt/keycloak/providers/
    networks:
      - default
    restart: unless-stopped

  init-keycloak-token:
    image: curlimages/curl:8.21.0
    depends_on:
      keycloak:
        condition: service_started
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - KEYCLOAK_ADMIN_TOKEN_LIFESPAN=1800
    volumes:
      - ../.resources/keycloak/extend-admin-token-lifespan.sh:/extend-admin-token-lifespan.sh:ro
    entrypoint: ["/bin/sh", "/extend-admin-token-lifespan.sh"]
    networks:
      - default
    restart: "no"

  init-keycloak:
    build:
      context: ../.resources/keycloak
      dockerfile: Dockerfile.keycloakmigration
    depends_on:
      init-keycloak-token:
        condition: service_completed_successfully
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - WAIT_FOR_KEYCLOAK=true
      - FAIL_ON_UNDEFINED_VARIABLES=true
      - KEYCLOAK_CHANGELOG=/migration/keycloak-changelog.yml
      # One-shot exit makes `ddev start` fail ("container exited"). Stay idle after success.
      - STAY_IDLE=true
    volumes:
      - ../.resources/keycloak/migration:/migration
    networks:
      - default
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x tail >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s

