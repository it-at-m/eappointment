services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    container_name: ddev-${DDEV_SITENAME}-keycloak
    command:
      - start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_DB=dev-file
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/plugins:/opt/keycloak/providers/
    networks:
      - default
    restart: unless-stopped

  init-keycloak-token:
    image: curlimages/curl:8.21.0
    depends_on:
      keycloak:
        condition: service_started
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - KEYCLOAK_ADMIN_TOKEN_LIFESPAN=1800
    volumes:
      - ../.resources/keycloak/extend-admin-token-lifespan.sh:/extend-admin-token-lifespan.sh:ro
    entrypoint: ["/bin/sh", "/extend-admin-token-lifespan.sh"]
    networks:
      - default
    restart: "no"

  # 0.2.131 JAR is Java 24; upstream image still ships a 23 JRE.
  init-keycloak-jar:
    image: klg71/keycloakmigration:0.2.131@sha256:a311cce3b961062000e6e9ef08ecb5712f3ea81859beeee8cd0c836fe8e4f2cf
    # Image is amd64-only. Apple Silicon (arm64) still works: Podman emulates this
    # one-shot `cp`. Java itself runs natively on Temurin below.
    platform: linux/amd64
    volumes:
      - keycloakmigration-jar:/out
    entrypoint: ["/bin/sh", "-c", "cp /keycloakmigration.jar /entrypoint.sh /out/"]
    networks:
      - default
    restart: "no"

  init-keycloak:
    image: eclipse-temurin:25-jre-alpine@sha256:3137541deb3cac6626b5d9a4a2187bc0d6a34312f858bd2c67dd01e732e6b682
    working_dir: /opt/keycloakmigration
    depends_on:
      init-keycloak-token:
        condition: service_completed_successfully
      init-keycloak-jar:
        condition: service_completed_successfully
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - BASEURL=http://keycloak:8080/auth
      - WAIT_FOR_KEYCLOAK=true
      - FAIL_ON_UNDEFINED_VARIABLES=true
      - KEYCLOAK_CHANGELOG=/migration/keycloak-changelog.yml
      # One-shot exit makes `ddev start` fail ("container exited"). Stay idle after success.
      - STAY_IDLE=true
    volumes:
      - keycloakmigration-jar:/opt/keycloakmigration:ro
      - ../.resources/keycloak/migration:/migration
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    networks:
      - default
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x tail >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s

volumes:
  keycloakmigration-jar:

